<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>dap-http</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #12151a;
      --panel: #1a1f27;
      --panel-2: #222933;
      --border: #2e3642;
      --text: #e8edf4;
      --muted: #8b96a8;
      --accent: #3d9cf0;
      --accent-dim: #2a6fa8;
      --ok: #3ecf8e;
      --err: #f07178;
      --hover: #283140;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "IBM Plex Sans", sans-serif;
    }
    body {
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 100%;
    }
    header {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      padding: 0.75rem 1.25rem;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #1c222c 0%, var(--bg) 100%);
    }
    header h1 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    header .meta {
      color: var(--muted);
      font-size: 0.8rem;
      font-family: "IBM Plex Mono", monospace;
      white-space: nowrap;
    }
    .search {
      flex: 1;
      display: flex;
      gap: 0.5rem;
      min-width: 12rem;
      max-width: 48rem;
    }
    .search input {
      flex: 1;
      min-width: 0;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.9rem;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.55rem 0.75rem;
      outline: none;
    }
    .search input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent-dim);
    }
    .search input::placeholder { color: var(--muted); }
    button {
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 500;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      border-radius: 4px;
      padding: 0.35rem 0.65rem;
      cursor: pointer;
      white-space: nowrap;
    }
    button:hover { background: var(--hover); border-color: var(--accent-dim); }
    button:disabled { opacity: 0.5; cursor: wait; }
    button.primary {
      background: var(--accent-dim);
      border-color: var(--accent);
    }
    button.ghost {
      background: transparent;
      padding: 0.2rem 0.45rem;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.75rem;
    }
    main {
      display: grid;
      grid-template-columns: minmax(240px, 34%) 1fr;
      min-height: 0;
    }
    #tree-panel, #detail-panel {
      min-height: 0;
      overflow: auto;
      padding: 0.75rem 1rem 1.5rem;
    }
    #tree-panel { border-right: 1px solid var(--border); }
    #detail-panel {
      background: var(--panel);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.82rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    #detail-body {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      min-height: 0;
      flex: 1;
      height: 100%;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    .results-meta {
      color: var(--muted);
      font-size: 0.8rem;
      font-family: "IBM Plex Mono", monospace;
      margin-bottom: 0.65rem;
    }
    .tree { list-style: none; margin: 0; padding: 0; }
    .tree ul { list-style: none; margin: 0; padding-left: 1.1rem; border-left: 1px solid var(--border); }
    .node {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 0.35rem;
      align-items: center;
      padding: 0.2rem 0.35rem;
      border-radius: 4px;
      margin: 0.1rem 0;
    }
    .node:hover { background: var(--hover); }
    .node.selected { background: #243447; outline: 1px solid var(--accent-dim); }
    .twist {
      width: 1.2rem;
      text-align: center;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
      font-family: "IBM Plex Mono", monospace;
    }
    .twist.empty { visibility: hidden; }
    .label {
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.8rem;
    }
    .kind {
      color: var(--muted);
      font-size: 0.7rem;
      margin-left: 0.4rem;
    }
    .kind.address { color: var(--accent); }
    .status-ok { color: var(--ok); }
    .status-err { color: var(--err); }
    .status-loading { color: var(--accent); }
    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .json-view {
      margin: 0;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.82rem;
      line-height: 1.45;
      overflow: auto;
      flex: 1;
      min-height: 0;
    }
    .json-view.plain {
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--muted);
    }
    .json-view.plain.error { color: var(--err); }
    .jv-line {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.25rem;
      padding: 0.1rem 0.25rem;
      margin: 0.05rem 0;
      border-radius: 3px;
    }
    .jv-twist {
      width: 1.1rem;
      flex: 0 0 1.1rem;
      text-align: center;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }
    .jv-twist.empty { visibility: hidden; cursor: default; }
    .jv-key { color: var(--accent); }
    .jv-key::after { content: ":"; color: var(--muted); margin-left: 0.1rem; }
    .jv-null, .jv-bool { color: #c792ea; }
    .jv-num { color: #f78c6c; }
    .jv-str { color: #c3e88d; }
    .jv-punct { color: var(--muted); }
    .jv-preview { color: var(--muted); font-size: 0.75rem; }
    .jv-refresh {
      background: transparent;
      border: 1px solid transparent;
      padding: 0 0.25rem;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      color: var(--muted);
      cursor: pointer;
      line-height: 1.2;
    }
    .jv-refresh:hover {
      color: var(--accent);
      border-color: var(--border);
      background: var(--hover);
    }
    .jv-refresh:disabled { opacity: 0.45; cursor: wait; }
    .jv-line[data-age="0"] { background: none; opacity: 1; }
    .jv-line[data-age="1"] {
      background: linear-gradient(90deg, rgba(120,130,145,0.18) 0%, rgba(120,130,145,0.07) 65%, transparent 100%);
      opacity: 0.96;
    }
    .jv-line[data-age="2"] {
      background: linear-gradient(90deg, rgba(120,130,145,0.24) 0%, rgba(120,130,145,0.10) 65%, transparent 100%);
      opacity: 0.92;
    }
    .jv-line[data-age="3"] {
      background: linear-gradient(90deg, rgba(120,130,145,0.30) 0%, rgba(120,130,145,0.12) 65%, transparent 100%);
      opacity: 0.88;
    }
    .jv-line[data-age="4"] {
      background: linear-gradient(90deg, rgba(120,130,145,0.36) 0%, rgba(120,130,145,0.14) 65%, transparent 100%);
      opacity: 0.84;
    }
    .jv-line[data-age="5"] {
      background: linear-gradient(90deg, rgba(120,130,145,0.42) 0%, rgba(120,130,145,0.17) 65%, transparent 100%);
      opacity: 0.80;
    }
    .jv-line[data-age="6"] {
      background: linear-gradient(90deg, rgba(120,130,145,0.48) 0%, rgba(120,130,145,0.19) 65%, transparent 100%);
      opacity: 0.76;
    }
    .jv-line[data-age="7"] {
      background: linear-gradient(90deg, rgba(120,130,145,0.54) 0%, rgba(120,130,145,0.22) 65%, transparent 100%);
      opacity: 0.72;
    }
    .jv-line[data-age="8"] {
      background: linear-gradient(90deg, rgba(120,130,145,0.60) 0%, rgba(120,130,145,0.24) 65%, transparent 100%);
      opacity: 0.68;
    }
    .jv-line[data-age="9"] {
      background: linear-gradient(90deg, rgba(120,130,145,0.66) 0%, rgba(120,130,145,0.26) 65%, transparent 100%);
      opacity: 0.64;
    }
    .jv-line[data-age="10"] {
      background: linear-gradient(90deg, rgba(120,130,145,0.72) 0%, rgba(120,130,145,0.29) 65%, transparent 100%);
      opacity: 0.58;
    }
    .jv-children {
      list-style: none;
      margin: 0;
      padding-left: 1.1rem;
      border-left: 1px solid var(--border);
    }
    .jv-composite.collapsed > .jv-children,
    .jv-composite.collapsed > .jv-close { display: none; }
    .jv-composite.collapsed > .jv-line > .jv-open { display: none; }
    .jv-composite:not(.collapsed) > .jv-line > .jv-preview { display: none; }
    .empty {
      color: var(--muted);
      padding: 1rem 0;
      line-height: 1.45;
    }
    #error-banner {
      display: none;
      margin: 0.5rem 0 0.75rem;
      padding: 0.6rem 0.75rem;
      border: 1px solid var(--err);
      border-radius: 4px;
      color: var(--err);
      background: #2a181a;
      font-size: 0.85rem;
    }
    #error-banner.visible { display: block; }
    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      min-height: 0;
      flex: 1 1 auto;
    }
    #detail-body.editor-open .detail-grid {
      flex: 1 1 50%;
      max-height: 50%;
    }
    .detail-card {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.65rem 0.75rem;
      min-height: 0;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }
    .detail-card h2 {
      margin: 0;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      font-family: "IBM Plex Sans", sans-serif;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .detail-card .path {
      color: var(--accent);
      font-size: 0.75rem;
    }
    #index-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem;
      margin: 0 0 0.65rem;
      padding: 0.55rem 0.75rem;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: "IBM Plex Sans", sans-serif;
      font-size: 0.8rem;
    }
    #index-bar[hidden] { display: none !important; }
    #index-bar label {
      color: var(--muted);
      font-size: 0.75rem;
    }
    #index-bar input[type="number"] {
      width: 4.5rem;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.8rem;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.3rem 0.4rem;
    }
    #index-bar .index-status {
      color: var(--muted);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      flex: 1 1 8rem;
      min-width: 0;
    }
    #index-bar .index-status.err { color: var(--err); }
    #index-bar .index-status.ok { color: var(--ok); }
    #index-inputs {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem;
    }
    #editor-panel {
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel-2);
      display: flex;
      flex-direction: column;
      gap: 0;
      min-height: 0;
      flex: 0 0 auto;
    }
    #editor-panel[hidden] { display: none !important; }
    #detail-body.editor-open #editor-panel {
      flex: 1 1 50%;
      max-height: 50%;
    }
    #editor-toggle {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      width: 100%;
      text-align: left;
      border: none;
      border-radius: 6px;
      background: transparent;
      padding: 0.55rem 0.75rem;
      font-family: "IBM Plex Sans", sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--muted);
    }
    #editor-toggle:hover { background: var(--hover); color: var(--text); }
    #editor-toggle .chevron {
      font-family: "IBM Plex Mono", monospace;
      color: var(--accent);
      width: 1rem;
    }
    #editor-body {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      padding: 0 0.75rem 0.75rem;
      min-height: 0;
      overflow: auto;
      flex: 1;
    }
    #editor-body[hidden] { display: none !important; }
    .editor-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      align-items: center;
    }
    .editor-row label {
      color: var(--muted);
      font-size: 0.75rem;
      font-family: "IBM Plex Sans", sans-serif;
    }
    select, .editor-row input, .field-row input, .field-row select {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.78rem;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.3rem 0.45rem;
    }
    .field-list {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      min-height: 0;
      overflow: auto;
      flex: 1;
    }
    .field-row {
      display: grid;
      grid-template-columns: 1.1fr 1.5fr auto auto 3.5rem auto auto auto;
      gap: 0.3rem;
      align-items: center;
    }
    .field-row .len {
      width: 3.5rem;
    }
    .create-box {
      border: 1px dashed var(--border);
      border-radius: 6px;
      padding: 0.55rem 0.65rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      flex: 0 0 auto;
    }
    .create-box h3 {
      margin: 0;
      font-size: 0.75rem;
      color: var(--muted);
      font-family: "IBM Plex Sans", sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    #editor-status {
      color: var(--muted);
      font-size: 0.75rem;
      min-height: 1rem;
    }
    #editor-status.err { color: var(--err); }
    #editor-status.ok { color: var(--ok); }
    @media (max-width: 1100px) {
      .detail-grid { grid-template-columns: 1fr; }
      .field-row {
        grid-template-columns: 1fr 1fr;
      }
    }
    @media (max-width: 900px) {
      header { flex-wrap: wrap; }
      .search { max-width: none; order: 3; flex: 1 1 100%; }
      main { grid-template-columns: 1fr; }
      #tree-panel { border-right: none; border-bottom: 1px solid var(--border); max-height: 35vh; }
    }
  </style>
</head>
<body>
  <header>
    <h1>dap-http</h1>
    <form class="search" id="search-form" action="#" onsubmit="return false;">
      <input
        id="route-search"
        type="search"
        placeholder="Search symbol, struct, or field — 0x… for address"
        autocomplete="off"
        spellcheck="false"
      />
      <button type="button" class="primary" id="search-submit">Search</button>
    </form>
    <span class="meta" id="route-count"></span>
    <button type="button" id="reload-tree">Reload</button>
  </header>
  <main>
    <section id="tree-panel">
      <div class="toolbar">
        <button type="button" id="clear-results">Clear results</button>
        <button type="button" id="refresh-visible">Refresh visible</button>
      </div>
      <div id="error-banner"></div>
      <div id="tree-root" class="empty">Loading route catalog…</div>
    </section>
    <section id="detail-panel">
      <div class="empty" id="detail-empty">Search for a route, then press ↻ to load memory.</div>
      <div id="detail-body" hidden>
        <div id="index-bar" hidden>
          <div id="index-inputs"></div>
          <button type="button" class="primary" id="index-fetch">Fetch</button>
          <button type="button" id="index-prev" title="Previous index">◀ Prev</button>
          <button type="button" id="index-next" title="Next index">Next ▶</button>
          <span class="index-status" id="index-status"></span>
        </div>
        <div class="detail-grid">
          <div class="detail-card">
            <h2>Source decode</h2>
            <div class="path" id="detail-path"></div>
            <div id="detail-decoded" class="json-view"></div>
          </div>
          <div class="detail-card">
            <h2>Overlay decode</h2>
            <div id="detail-overlay" class="json-view plain">No overlay applied for this type.</div>
          </div>
        </div>
        <div id="editor-panel" hidden>
          <button type="button" id="editor-toggle" aria-expanded="false">
            <span class="chevron" id="editor-chevron">▶</span>
            <span>Struct editor</span>
          </button>
          <div id="editor-body" hidden>
            <div class="editor-row">
              <label for="edit-struct">Edit struct</label>
              <input id="edit-struct" list="struct-type-list" placeholder="namespace#StructName" />
              <button type="button" id="edit-struct-load">Load fields</button>
              <button type="button" class="primary" id="overlay-apply">Apply</button>
              <button type="button" id="overlay-reset">Reset this struct</button>
              <button type="button" id="overlay-add-field">Add field</button>
            </div>
            <datalist id="struct-type-list"></datalist>
            <datalist id="all-type-list"></datalist>
            <div class="field-list" id="field-list"></div>
            <div class="create-box">
              <h3>Create new struct</h3>
              <div class="editor-row">
                <input id="new-struct-id" placeholder="MyStruct" />
                <button type="button" id="create-struct">Create</button>
              </div>
            </div>
            <div id="editor-status"></div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script type="text/javascript" src="/assets/main.js"></script>
</body>
</html>
